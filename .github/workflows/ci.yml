# This project is parked, not finished. CI exists so it stops rotting further -- it
# catches unused imports, syntax breakage and a build that no longer completes.
#
# Two gates are deliberately NOT run here, because both fail for real reasons and a
# permanently red CI teaches everyone to ignore it. Neither is hidden; both are recorded
# so whoever picks this up finds them:
#
#   npm run typecheck  -- ~10 errors, all in packages/server/src/analyze/phases.ts.
#     TypeScript narrows `current` to its initializer "preflight" and then reports every
#     other case in the switch as unreachable-by-type, because emit() reassigns `current`
#     through a closure and control-flow analysis does not track that. Plus one
#     strict-null error at phases.ts:72. Fixing it means restructuring that loop.
#
#   npm test           -- 66 of 67 pass. The failure is
#     "detectPhases > normal-xc: clean single-leg sequence", which expects the last phase
#     to be `postflight` and gets `landing`. That is a genuine defect, not a stale test:
#     the chain is landing -> (grounded) rollout -> (!moving) taxi -> (rpm<200) postflight,
#     and a normal flight never leaves `landing`. The same missing exit is why a balked
#     landing swallows the rest of a flight.
#
# Re-enable each step as its underlying defect is fixed.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
