version: 2

# Keeps the actions in .github/ current. Added 2026-11-17: every workflow here was still on
# Node 20 actions (checkout@v4, setup-node@v4, ...) after GitHub removed Node 20 from its
# runners on 2026-09-23. Only security updates were on before, and those never touch actions.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR for all action bumps instead of one per action
      actions:
        patterns: ["*"]
