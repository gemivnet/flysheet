# Dev stack: database + grafana only. The app runs on the host:
#   npm run dev:server   (Express + pipeline on :8080)
#   npm run dev:web      (Vite on :5173, proxies /api to :8080)
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: foqa
      POSTGRES_PASSWORD: foqa
      POSTGRES_DB: foqa
    ports:
      # Loopback only: the credentials above are foqa/foqa. This stack is documented as
      # dev-on-the-host, so nothing off-box needs to reach the database.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foqa -d foqa']
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      # Loopback only: anonymous auth is on with the Admin role below, so on 0.0.0.0
      # anyone reaching this port is a Grafana admin with no login.
      - '127.0.0.1:3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DATABASE_WAL: 'true'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-dev:
